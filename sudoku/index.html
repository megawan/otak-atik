<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku · Otak-Atik</title>
  <meta name="description" content="Sudoku lima level, dari Newbie sampai Extreme.">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="sudoku.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <a class="back" href="../">← Otak-Atik</a>
      <div class="time" id="time" role="timer" aria-label="Waktu bermain">00:00</div>
    </header>

    <h1>Sudoku</h1>

    <div class="levels" id="levels" role="group" aria-label="Level"></div>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Papan sudoku"></div>
      <div class="loading" id="loading" hidden>Menyiapkan puzzle…</div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="tools">
      <button class="btn" id="undo">↩ Undo</button>
      <button class="btn" id="erase">⌫ Hapus</button>
      <button class="btn" id="notes" aria-pressed="false">✎ Catatan: mati</button>
      <button class="btn" id="hint">💡 Petunjuk</button>
      <button class="btn" id="check">✓ Periksa</button>
    </div>

    <div class="pad" id="pad" role="group" aria-label="Papan angka"></div>

    <p class="keys muted">Keyboard: 1–9 isi, 0/Backspace hapus, panah pindah, N catatan, Z undo, H petunjuk.</p>
  </main>

  <dialog id="win">
    <h2>Selesai! 🎉</h2>
    <p id="win-text"></p>
    <form method="dialog" class="win-actions">
      <button class="btn" value="close">Tutup</button>
      <button class="btn primary" value="again" id="again">Main lagi</button>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
