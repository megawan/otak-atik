<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Otak-Atik</title>
  <meta name="description" content="A collection of puzzles for adults. Free, no account, runs in your browser.">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    h1 { font-size: 2.4rem; margin: 32px 0 4px; letter-spacing: -0.02em; }
    .cards { display: grid; gap: 12px; margin-top: 24px; }
    .card {
      display: block;
      text-decoration: none;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .card:hover { border-color: var(--accent); }
    .card h2 { margin: 0 0 2px; font-size: 1.25rem; }
    .card p { margin: 0; }
    footer { margin-top: 40px; font-size: .875rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Otak-Atik 🧩</h1>
    <p class="muted">A collection of puzzles for adults. No account, no ads. Your progress is saved in your browser.</p>
    <div class="cards">
      <a class="card" href="sudoku/">
        <h2>🔢 Sudoku</h2>
        <p class="muted">Five levels, from Newbie to Extreme. With pencil notes, undo and hints.</p>
      </a>
    </div>
    <footer class="muted">All data stays on your device. Clearing the site data clears your progress.</footer>
  </main>
</body>
</html>
